services:
  postgres:
    image: postgres:17-alpine
    container_name: ois-example-pg
    environment:
      POSTGRES_USER: ois
      POSTGRES_PASSWORD: "Your_password123"
      POSTGRES_DB: OisExample
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ois"]
      interval: 10s
      timeout: 5s
      retries: 10
